# Настройки лабораторной 4 поверх shop-chart/values.yaml
batch:
  enabled: true
  replicas: 1
  image:
    repository: docker.io/library/shop-batch
    tag: v1
    pullPolicy: IfNotPresent
  cpuWorkers: 1
  memoryMiB: 64
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 128Mi

api:
  pdb:
    enabled: true
    minAvailable: 2
  # none | topologySpreadConstraints | podAntiAffinity
  placement: topologySpreadConstraints
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 100Mi

worker:
  replicas: 6
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 100Mi

postgres:
  resources:
    requests:
      cpu: "1"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi
 
priority:
  enabled: true
  highValue: 10000
  lowValue: -1000

lab4Dashboard:
  enabled: true
