apiVersion: v1
kind: Pod
metadata:
  name: shop-batch-oom
  namespace: shop
  labels:
    app: shop-batch-oom
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: oom-test
spec:
  restartPolicy: Never
  priorityClassName: shop-shop-batch
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: batch
      image: docker.io/library/shop-batch:v1
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: CPU_WORKERS
          value: "0"
        - name: MEMORY_MIB
          value: "256"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
