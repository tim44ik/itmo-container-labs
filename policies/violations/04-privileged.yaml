{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "bad-04-privileged",
    "namespace": "shop",
    "labels": {
      "app": "policy-demo",
      "app.kubernetes.io/name": "policy-demo"
    }
  },
  "spec": {
    "restartPolicy": "Never",
    "automountServiceAccountToken": false,
    "securityContext": {
      "runAsNonRoot": true,
      "runAsUser": 65532,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "demo",
        "image": "docker.io/library/busybox:1.37.0",
        "command": [
          "sh",
          "-c",
          "sleep 30"
        ],
        "securityContext": {
          "privileged": true,
          "readOnlyRootFilesystem": true,
          "allowPrivilegeEscalation": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          }
        },
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "16Mi"
          },
          "limits": {
            "cpu": "100m",
            "memory": "32Mi"
          }
        }
      }
    ]
  }
}
