apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lab3-require-resources
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
              names:
                - etcd-labs-control-plane
                - kube-apiserver-labs-control-plane
                - kube-controller-manager-labs-control-plane
                - kube-scheduler-labs-control-plane
      validate:
        message: "CPU and memory requests and limits are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            "=(initContainers)":
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
