apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab3-storage-test
  namespace: shop
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: lab3-storage-test
  namespace: shop
  labels:
    app: lab3-storage-test
    app.kubernetes.io/name: lab3-storage-test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: docker.io/library/busybox:1.37.0
      command:
        - sh
        - -c
        - |
          set -eu
          echo "storage-ok" > /data/check.txt
          cat /data/check.txt
          sleep 3600
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lab3-storage-test
