apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  groups:
  - name: api.rules
    rules:
    - alert: HighErrorRate
      expr: |
        sum(rate(http_requests_total{job="api-service-scrape", status=~"5.."}[1m]))
        /
        sum(rate(http_requests_total{job="api-service-scrape"}[1m]))
        > 0.5
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "Высокая доля 5xx ошибок на API"
        description: "Более 50% запросов возвращают 5xx за последнюю минуту."

    - alert: HighLatency
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket{job="api-service-scrape"}[1m])) by (le)
        ) > 1
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "Высокая задержка p95 на API"
        description: "95-й процентиль времени ответа >5s за последнюю минуту."

    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }[1m])) by (pod) > 0.8
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "Высокая нагрузка на CPU у API"
        description: "CPU usage пода api-deployment >0.8 cores за последнюю минуту."