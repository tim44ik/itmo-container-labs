apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: container-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  groups:
  - name: container.rules
    rules:
    - alert: ContainerCPUThrottling
      expr: |
        sum(rate(container_cpu_cfs_throttled_periods_total{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }[1m])) by (pod)
        /
        sum(rate(container_cpu_cfs_periods_total{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }[1m])) by (pod)
        > 0.3
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "CPU throttling у контейнера {{ $labels.pod }}"
        description: "Более 30% периодов CFS throttled за последнюю минуту. Контейнер упирается в limits.cpu."

    - alert: ContainerHighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }) by (pod)
        /
        sum(container_spec_memory_limit_bytes{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }) by (pod)
        > 0.85
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "Высокое потребление памяти у контейнера {{ $labels.pod }}"
        description: "Working set >85% от memory limit. Близко к OOMKill."

    - alert: ContainerHighDiskWriteRate
      expr: |
        sum(rate(container_fs_writes_bytes_total{
          namespace="default",
          pod=~"api-deployment.*",
          container="api-container"
        }[1m])) by (pod) > 1e7
      for: 1m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "Аномальная запись на диск у контейнера {{ $labels.pod }}"
        description: "Скорость записи >10 MB/s за последнюю минуту."