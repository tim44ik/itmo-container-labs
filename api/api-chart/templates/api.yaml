apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-container
        image: api-multi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: api-service
    release: kube-prometheus
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: api-service
