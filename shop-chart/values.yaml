# Resource requests and limits for the shop workloads.
api:
  replicas: 3
  image:
    repository: docker.io/library/shop-api
    tag: v2
    pullPolicy: IfNotPresent
  healthFail: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

canary:
  enabled: false
  versions:
    v1:
      tag: v1
      replicas: 2
      flaky: false
      fail: false
    v2:
      tag: v2
      replicas: 1
      flaky: false
      fail: false
  traffic:
    v1: 90
    v2: 10
  retries:
    enabled: false
    limit: 3
    timeout: 1s

mesh:
  enabled: false

loadGenerator:
  enabled: false
  image: curlimages/curl:8.12.1

worker:
  replicas: 2
  image:
    repository: docker.io/library/shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  healthFail: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080

database:
  existingSecret: ""
  secretKey: uri

telemetry:
  otlpEndpoint: http://jaeger.monitoring.svc.cluster.local:4318

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

postgres:
  enabled: true
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

networkPolicy:
  enabled: false
  defaultDeny: true
