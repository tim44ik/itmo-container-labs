apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: shop-api
        app.kubernetes.io/name: shop
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      {{- $placement := .Values.api.placement | default "none" }}
      {{- if eq $placement "topologySpreadConstraints" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shop
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- else if eq $placement "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: shop
                    app.kubernetes.io/component: api
                    app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- else if ne $placement "none" }}
      {{- fail "api.placement must be none, topologySpreadConstraints or podAntiAffinity" }}
      {{- end }}
      {{- if (.Values.priority | default dict).enabled }}
      priorityClassName: {{ printf "%s-%s-critical" .Release.Namespace .Release.Name | quote }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres-app" .Release.Name) .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: OTEL_SERVICE_NAME
              value: shop-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
