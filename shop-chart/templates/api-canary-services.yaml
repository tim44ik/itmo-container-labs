{{- if .Values.canary.enabled }}
{{- range $version, $config := .Values.canary.versions }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-api-%s" $.Release.Name $version }}
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: api
    version: {{ $version | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: api
    app.kubernetes.io/version: {{ $version | quote }}
  ports:
    - name: http
      port: {{ $.Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if $.Values.mesh.enabled }}
    - name: proxy-metrics
      port: 4191
      targetPort: linkerd-admin
      protocol: TCP
    {{- end }}
---
{{- end }}
{{- end }}
