apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  groups:
    - name: {{ .Release.Name }}.alerts
      interval: 15s
      rules:
        - alert: ShopTargetDown
          expr: |
            up{namespace="{{ .Release.Namespace }}",service=~"{{ .Release.Name }}-api|{{ .Release.Name }}-worker"} == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Не удаётся собрать метрики экземпляра shop"
            description: "Prometheus не может опросить /metrics одной из целей API или worker более минуты."

        - alert: ShopApiHighErrorRatio
          expr: |
            (
              sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-api",status=~"5.."}[2m]))
              /
              clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-api"}[2m])), 0.000001)
            ) > 0.05
          for: 1m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            service: {{ .Release.Name }}-api
          annotations:
            summary: "Высокая доля HTTP 5xx у shop-api"
            description: "Доля HTTP 5xx превышает 5% в течение минуты."

        - alert: ShopNetworkPolicyDrops
          expr: |
            (
              sum(increase(hubble_flows_processed_total{verdict="DROPPED",source_namespace="{{ .Release.Namespace }}"}[5m]))
              +
              sum(increase(hubble_flows_processed_total{verdict="DROPPED",destination_namespace="{{ .Release.Namespace }}"}[5m]))
            ) > 0
          for: 1m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            service: {{ .Release.Name }}
          annotations:
            summary: "Cilium заблокировал сетевой трафик в namespace shop"
            description: "Hubble зарегистрировал отброшенные потоки к подам shop за последние 5 минут."

        - alert: ShopDNSFailures
          expr: |
            sum(increase(coredns_dns_responses_total{job="coredns",rcode="SERVFAIL"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            service: {{ .Release.Name }}
          annotations:
            summary: "CoreDNS возвращает SERVFAIL"
            description: "CoreDNS зарегистрировал SERVFAIL за последние 5 минут."

        - alert: ShopWorkerErrors
          expr: |
            sum(increase(worker_errors_total{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-worker"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            service: {{ .Release.Name }}-worker
          annotations:
            summary: "Worker фиксирует ошибки"
            description: "За последние 5 минут зарегистрированы ошибки опроса базы или транзакций worker."
