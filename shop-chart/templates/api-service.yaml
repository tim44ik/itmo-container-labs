apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
