apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: shop-worker
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.worker.service.type }}
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP
